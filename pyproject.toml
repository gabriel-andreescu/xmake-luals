[project]
name = "xmake-luals"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pre-commit>=4.6.2,<5", "pytest>=8.4,<10", "ruff>=0.16.7"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["scratch"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
